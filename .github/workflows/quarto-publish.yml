name: Publish Quarto website

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install R system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e 'pkgs <- c("knitr", "rmarkdown", "readr", "dplyr", "gt", "stringr"); install.packages(pkgs, repos = Sys.getenv("RSPM")); missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) install.packages(missing, repos = "https://cloud.r-project.org"); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)))'

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: quarto-dev/quarto-actions/render@v2

      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
